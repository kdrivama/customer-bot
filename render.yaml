services:
  - type: web
    name: customer-service-trainer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: AI_MODE
        value: rephrase
      - key: AI_PROVIDER
        value: deepseek
      # Blank uses the provider default: deepseek-chat for DeepSeek.
      - key: AI_MODELS
        value: ""
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "60"
      # Set these in the Render dashboard, not here.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HTTP_REFERER
        sync: false
